AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Murmuration — Coordinated Neighbourhood Energy Intelligence
  FlockShield coordination engine + household optimizer
  Team: Hackit247 | Environmental Hacks Bharat Builds Tour Event 02

Globals:
  Function:
    Runtime: python3.11
    Architectures: [x86_64]
    Environment:
      Variables:
        HOUSEHOLDS_TABLE: !Ref HouseholdsTable
        CORS_ORIGINS: !Sub "https://${AmplifyApp}.amplifyapp.com,http://localhost:5173"
    Tracing: Active

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment
  AmplifyApp:
    Type: String
    Default: "PLACEHOLDER"
    Description: Amplify app ID (update after first deploy)

Resources:
  # ── API + Lambda ──────────────────────────────────────────────────────────

  MurmurationApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # Caps what an anonymous caller can spend: 10 requests a second, bursts of 20.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      # CORS is answered by FastAPI (backend/app.py), which already allows any
      # *.amplifyapp.com origin. Configuring it here as well would override that.

  MurmurationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "murmuration-api-${Environment}"
      CodeUri: backend/
      Handler: app.handler
      MemorySize: 1024      # more memory also means more CPU, which the EV sweep needs
      Timeout: 60           # 60s for large simulations
      Description: "Murmuration API — FastAPI via Mangum"
      Policies:
        # Least privilege: the API only reads and writes single profiles.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt HouseholdsTable.Arn
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref MurmurationApi
            Path: /{proxy+}
            Method: ANY
        ApiHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref MurmurationApi
            Path: /health
            Method: GET

  # ── DynamoDB ──────────────────────────────────────────────────────────────

  HouseholdsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain      # Do not delete household profiles on stack deletion
    Properties:
      TableName: !Sub "murmuration-households-${Environment}"
      BillingMode: PAY_PER_REQUEST   # On-demand; free tier covers small use
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Amplify Hosting ───────────────────────────────────────────────────────
  # NOTE: Connect the GitHub repo to Amplify in the AWS Console.
  # Set environment variable VITE_API_URL to the HttpApiUrl output below.

Outputs:
  HttpApiUrl:
    Description: "API Gateway HTTP API endpoint URL"
    Value: !Sub "https://${MurmurationApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  FunctionArn:
    Description: "Lambda function ARN"
    Value: !GetAtt MurmurationFunction.Arn

  HouseholdsTableName:
    Description: "DynamoDB table name"
    Value: !Ref HouseholdsTable
